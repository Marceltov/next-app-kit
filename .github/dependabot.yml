# Dependency bumps as pull requests with CI run (convention "Dependabot with auto-merge"): patch and minor bumps merge by themselves once
# check is green (dependabot-automerge.yml), majors wait for review. Security updates (switched on in the repository's settings) come at
# once and skip the cooldown; everything else waits two weeks after a release and comes grouped on Monday mornings.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    ignore:
      # @types/node follows the Node major in .nvmrc and engines, by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 (the Go port) has no API typescript-eslint can use yet; lift this once it has.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      # The peers that move together: an app pins the same exact versions, so they change in one pull request and one kit release.
      peers:
        patterns: [better-auth, "@better-auth/*", "@modelcontextprotocol/server", next]
      minor-and-patch:
        update-types: [minor, patch]

  # The example app's own dependencies (React, Playwright, its types). The kit's peers are pinned there at the kit's exact versions and move
  # with the kit's, by hand in the same pull request (README, "Peers move together"), so they are left out here.
  - package-ecosystem: npm
    directory: /examples/minimal
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    ignore:
      - dependency-name: next-app-kit
      - dependency-name: better-auth
      - dependency-name: "@better-auth/*"
      - dependency-name: "@modelcontextprotocol/server"
      - dependency-name: next
      - dependency-name: better-sqlite3
      - dependency-name: kysely
      - dependency-name: nodemailer
      - dependency-name: zod
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
